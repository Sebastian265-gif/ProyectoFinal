<div class="header">

  <!-- LOGO IZQUIERDA -->
  <div class="logo">
    <p-image class="hola" width="70"
      src="https://images.vexels.com/content/229082/preview/book-circles-logo-82dff4.png">
    </p-image>
  </div>

  <!-- BOTÓN HAMBURGUESA SOLO MOBILE -->
  <button class="toggle-btn" (click)="toggleMenu()">
    <i class="pi pi-bars"></i>
  </button>

  <!-- MENÚ (NO PRIME MENUBAR → MENÚ PERSONALIZADO) -->
  <div class="menu-wrapper" [class.show]="menuVisible">

    <div class="menu-list">
      <a *ngFor="let item of items"
         [routerLink]="item['route']"
         (click)="onItemClick(item)"
         class="menu-item">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </div>

  </div>

</div>
