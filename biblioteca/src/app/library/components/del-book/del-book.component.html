
<div class="card flex justify-content-center p-fluid">
    <form [formGroup]="deleteForm" (ngSubmit)="onDelete()">
        <p-card header="Seleccione ID del Libro">
            <div class="field">
                <label for="deleteBookId">ID del Libro</label>
                <input id="deleteBokkId" pInputText formControlName="bookId"/>
                <div *ngIf="deleteForm.controls['bookId'].invalid && deleteForm.controls['bookId'].touched" class="error">ID no válido</div>
            </div>
            <br>
            <button type="submit" pButton label="Eliminar Libro" [disabled]="deleteForm.invalid" class="p-button-danger"></button>
            <div class="p-mt-3">
                <p-message *ngIf="succesMessage" severity="success" text="{{succesMessage}}"></p-message>
                <p-message *ngIf="errorMessage" severity="error" text="{{errorMessage}}"></p-message>
            </div>
        </p-card>
    </form>
</div>
