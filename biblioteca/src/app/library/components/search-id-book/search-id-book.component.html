<div class="search-container">
  <div class="search-card">
    <h1 class="search-title">Seleccione ID del Libro</h1>

    <div class="search-controls">
      <p-dropdown
        id="bookId"
        [options]="Ids"
        placeholder="Seleccionar ID..."
        [showClear]="true"
        [(ngModel)]="bookId"
        class="dropdown-full"
      ></p-dropdown>

      <button
        pButton
        type="button"
        label="Buscar"
        (click)="searchIdBook()"
        class="search-btn"
        [disabled]="isLoading"
      ></button>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <div class="transparent-table-wrapper">
      <p-table *ngIf="books.length" [value]="books" class="transparent-table">
        <ng-template pTemplate="header">
          <tr>
            <th>Portada</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Editorial</th>
            <th>Páginas</th>
            <th>Progreso</th>
            <th>Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-book>
          <tr>
            <td>
              <img
                [src]="book.cover || 'assets/default-cover.png'"
                style="width:55px; height:75px; border-radius:6px; object-fit:cover;"
              />
            </td>
            <td>{{ book.tittle }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.editorial }}</td>
            <td>{{ book.pages }}</td>
            <td style="position: relative; width: 160px;">
              <p-progressBar
                [value]="book.pages ? (book.current_page / book.pages) * 100 : 0"
                [showValue]="false">
              </p-progressBar>
              <span class="progress-text">{{ book.current_page }} / {{ book.pages }}</span>
            </td>
            <td>
              <button pButton label="Editar" class="p-button-sm p-button-warning mb-1"
                      (click)="gotoEdit(book.id)">
              </button>
              <button pButton label="Eliminar" class="p-button-sm p-button-danger"
                      (click)="gotoDelete(book.id)">
              </button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
