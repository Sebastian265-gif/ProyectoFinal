
<div class="card flex justify-content-center p-fluid">
    <p-card header="Seleccione ID del Libro">
        <div class="field">
            <p-dropdown id="bookId" [options]="Ids" class="w-full" containerStyleClass="w-full" placeholder="ID" [showClear]="true" [(ngModel)]="bookId"/>
            <p *ngIf="errorMessage" class="error-message">{{errorMessage}}</p>
            <br>
            <button pButton type="button" label="Buscar" (click)="searchIdBook()" [disabled]="isLoading" class="customizeButton"></button>
        </div>
        <br>
        <p-table *ngIf="books.length" [value]="books">
            <ng-template pTemplate="header">
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Editorial</th>
                    <th>Paginas</th>
                    <th>Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-book>
                <tr>
                    <td>{{ book.tittle }}</td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.editorial }}</td>
                    <td>{{ book.pages }}</td>
                    <td>
                        <div class="grid">
                            <div class="col"> <button pButton type="button" label="Editar" class="p-button- sm p-button-warning" (click)="gotoEdit(book.id)"></button></div>
                            <div class="col"> <button pButton type="button" label="Eliminar" class="p-button- sm p-button-danger" (click)="gotoDelete(book.id)"></button></div>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
