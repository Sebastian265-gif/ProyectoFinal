<div class="p-fluid">
    <h1>EDITAR LIBRO 2</h1>
    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
        <div class="field">
            <label for="Id">Seleccione un ID</label>
            <p-dropdown
                id="Id"
                [options]="Ids"
                class="md:w-20rem w-full"
                containerStyleClass="w-full"
                placeholder="Id"
                formControlName="Id"
                [showClear]="true"
                (onChange)="onIdChange($event)">
            </p-dropdown>
            <div class="error" *ngIf="updateForm.controls['Id'].invalid && updateForm.controls['Id'].touched">
                El id es necesario!
            </div>
        </div>

        <div class="field">
            <label for="tittle">Titulo</label>
            <input pInputText type="text" formControlName="tittle" id="tittle" class="w-full">
            <div class="error" *ngIf="updateForm.controls['tittle'].invalid && updateForm.controls['tittle'].touched">
                El titulo es necesario!
            </div>
        </div>

        <div class="field">
            <label for="author">Autor</label>
            <input pInputText type="text" formControlName="author" id="author" class="w-full">
            <div class="error" *ngIf="updateForm.controls['author'].invalid && updateForm.controls['author'].touched">
                El autor es necesario!
            </div>
        </div>

        <div class="field">
            <label for="editorial">Editorial</label>
            <input pInputText type="text" formControlName="editorial" id="editorial" class="w-full">
            <div class="error" *ngIf="updateForm.controls['editorial'].invalid && updateForm.controls['editorial'].touched">
                El editorial es necesario!
            </div>
        </div>

        <div class="field">
            <label for="pages">Numero de paginas</label>
            <input pInputText type="number" formControlName="pages" id="pages" class="w-full">
            <div class="error" *ngIf="updateForm.controls['pages'].invalid && updateForm.controls['pages'].touched">
                El numero de paginas es necesario!
            </div>
        </div>

        <div class="field">
            <button pButton label="Actualizar información" [disabled]="updateForm.invalid" class="customizeButton"></button>
            <div class="p-mt-3">
                <p-message *ngIf="successMessage" severity="success" text="{{successMessage}}"></p-message>
                <p-message *ngIf="errMessage" severity="error" text="{{errMessage}}"></p-message>
            </div>
        </div>
    </form>
</div>
