<div class="login-wrapper">
  <form [formGroup]="myForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="login-card">

      <button type="button" routerLink="/landing" class="home-icon-btn">
        <i class='bx bxs-home'></i>
      </button>

      <!-- Encabezado -->
      <h2 class="login-header">Login</h2>

    
      <div class="input-box">
        <input type="text" formControlName="usuario" placeholder="Correo electrónico" />
        <i class='bx bxs-user'></i>
        <small *ngIf="myForm.get('usuario')?.invalid && myForm.get('usuario')?.touched">
          El usuario debe ser un correo electrónico válido.
        </small>
      </div>

     
      <div class="input-box">
        <input type="password" formControlName="password" placeholder="Contraseña" />
        <i class='bx bxs-lock-alt'></i>
        <small *ngIf="myForm.get('password')?.invalid && myForm.get('password')?.touched">
          La contraseña debe tener mínimo 8 caracteres.
        </small>
      </div>

      <!-- Botón login -->
      <button type="submit" class="login-button">Iniciar sesión</button>

      <p class="error-msg">{{ errorMsg }}</p>

      <div class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
      </div>

      
    </div>
  </form>
</div>
