<div class="p-fluid form-container">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <div class="p-field">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" pInputText formControlName="nombre" />
      <small *ngIf="registroForm.controls['nombre'].touched && registroForm.controls['nombre'].invalid" class="p-error">
        El nombre es obligatorio
      </small>
    </div>

    <div class="p-field">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" pInputText formControlName="apellido" />
      <small *ngIf="registroForm.controls['apellido'].touched && registroForm.controls['apellido'].invalid" class="p-error">
        El apellido es obligatorio
      </small>
    </div>

    <div class="p-field">
      <label for="email">Correo Electrónico</label>
      <input id="email" type="email" pInputText formControlName="email" />
      <small *ngIf="registroForm.controls['email'].touched && registroForm.controls['email'].invalid" class="p-error">
        Correo electrónico no válido
      </small>
    </div>

    <div class="p-field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" pInputText formControlName="password" />
      <small *ngIf="registroForm.controls['password'].touched && registroForm.controls['password'].invalid" class="p-error">
        La contraseña debe tener al menos 8 caracteres
      </small>
    </div>

    <!-- CONFIRMAR CONTRASEÑA -->
    <div class="p-field">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" pInputText formControlName="confirmPassword" />

      <small *ngIf="
        registroForm.controls['confirmPassword'].touched &&
        registroForm.hasError('mismatch')
      " class="p-error">
        Las contraseñas no coinciden
      </small>
    </div>

    <div class="p-field">
      <label for="fechaNacimiento">Fecha de Nacimiento</label>
      <p-calendar id="fechaNacimiento" formControlName="fechaNacimiento" dateFormat="dd/mm/yy"></p-calendar>
      <small *ngIf="registroForm.controls['fechaNacimiento'].touched && registroForm.controls['fechaNacimiento'].invalid" class="p-error">
        La fecha de nacimiento es obligatoria
      </small>
    </div>

    <div class="p-field">
      <label for="genero">Género</label>
      <p-dropdown id="genero" [options]="generos" formControlName="genero" placeholder="Seleccione un género"></p-dropdown>
      <small *ngIf="registroForm.controls['genero'].touched && registroForm.controls['genero'].invalid" class="p-error">
        El género es obligatorio
      </small>
    </div>

    <button pButton type="submit" label="Registrarse" [disabled]="registroForm.invalid"></button>
  </form>
</div>
