<div class="registro-page">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="registro-card">

    <h1>Registro</h1>

    <div class="input-box">
      <input id="nombre" type="text" formControlName="nombre" placeholder="Nombre" />
      <i class="fa fa-user"></i>
      <small *ngIf="registroForm.controls['nombre'].touched && registroForm.controls['nombre'].invalid" class="error-msg">
        El nombre es obligatorio
      </small>
    </div>

    <div class="input-box">
      <input id="apellido" type="text" formControlName="apellido" placeholder="Apellido" />
      <i class="fa fa-user"></i>
      <small *ngIf="registroForm.controls['apellido'].touched && registroForm.controls['apellido'].invalid" class="error-msg">
        El apellido es obligatorio
      </small>
    </div>

    <div class="input-box">
      <input id="email" type="email" formControlName="email" placeholder="Correo Electrónico" />
      <i class="fa fa-envelope"></i>
      <small *ngIf="registroForm.controls['email'].touched && registroForm.controls['email'].invalid" class="error-msg">
        Correo electrónico no válido
      </small>
    </div>

    <div class="input-box">
      <input id="password" type="password" formControlName="password" placeholder="Contraseña" />
      <i class="fa fa-lock"></i>
      <small *ngIf="registroForm.controls['password'].touched && registroForm.controls['password'].invalid" class="error-msg">
        La contraseña debe tener al menos 8 caracteres
      </small>
    </div>

    <div class="input-box">
      <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirmar Contraseña" />
      <i class="fa fa-lock"></i>
      <small *ngIf="registroForm.controls['confirmPassword'].touched && registroForm.hasError('mismatch')" class="error-msg">
        Las contraseñas no coinciden
      </small>
    </div>

    <!-- CALENDARIO MODERNO -->
    <div class="input-box calendar-box">
      <p-calendar 
        id="fechaNacimiento" 
        formControlName="fechaNacimiento" 
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        placeholder="Fecha de Nacimiento">
      </p-calendar>
      <i class="fa fa-calendar calendar-icon"></i>
      <small *ngIf="registroForm.controls['fechaNacimiento'].touched && registroForm.controls['fechaNacimiento'].invalid" class="error-msg">
        La fecha de nacimiento es obligatoria
      </small>
    </div>

    <div class="input-box">
      <p-dropdown id="genero" [options]="generos" formControlName="genero" placeholder="Seleccione un género"></p-dropdown>
      <i class="fa fa-venus-mars"></i>
      <small *ngIf="registroForm.controls['genero'].touched && registroForm.controls['genero'].invalid" class="error-msg">
        El género es obligatorio
      </small>
    </div>

    <button type="submit" [disabled]="registroForm.invalid" class="registro-btn">
      Registrarse
    </button>

    <!-- NUEVOS BOTONES -->
    <div class="links-container">
      <button type="button" routerLink="/" class="link-btn">Ir a Inicio</button>
      <button type="button" routerLink="/login" class="link-btn">Ir a Login</button>
    </div>

  </form>
</div>
